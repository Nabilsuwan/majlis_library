# Installed at /etc/nginx/sites-available/majlis.conf on the server.
# Certbot will edit this file automatically to add the SSL block
# when you run `certbot --nginx` (see DEPLOY.md).

server {
    listen 80;
    server_name sharjahbook.com www.sharjahbook.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
