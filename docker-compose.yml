services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: majlis
      POSTGRES_USER: majlis
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"   # bound to localhost only — not exposed publicly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U majlis -d majlis"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://majlis:${DB_PASSWORD}@db:5432/majlis
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"   # nginx (on the host) proxies to this

volumes:
  db_data:
